name: Android CD (Main)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Play track target"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - production

concurrency:
  group: cd-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Created app/google-services.json from secret"
          else
            echo "Missing app/google-services.json."
            echo "Add the file in repository or configure GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi

      - name: Prepare release signing keystore (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "Release signing is enabled."
          else
            echo "Release signing secrets are incomplete. Falling back to debug signing."
          fi

      - name: Verify and build release bundle
        shell: bash
        env:
          NAVERMAP_API_KEY: ${{ secrets.NAVERMAP_API_KEY || 'dummy' }}
          KAKAOLOGIN_API_KEY: ${{ secrets.KAKAOLOGIN_API_KEY || 'dummy' }}
          KAKAOLOGIN_REDIRECT_URI: ${{ secrets.KAKAOLOGIN_REDIRECT_URI || 'dummy://redirect' }}
          NAVERLOGIN_CLIENTID: ${{ secrets.NAVERLOGIN_CLIENTID || 'dummy' }}
          NAVERLOGIN_CLIENTSECRET: ${{ secrets.NAVERLOGIN_CLIENTSECRET || 'dummy' }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || 'dummy' }}
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon \
            :app:detekt \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:koverVerifyDebug \
            :app:bundleRelease

      - name: Prepare Play service account file
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing PLAY_SERVICE_ACCOUNT_JSON secret."
            echo "Add Google Play service account json to GitHub Secrets."
            exit 1
          fi
          PLAY_JSON_PATH="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_JSON_PATH"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$PLAY_JSON_PATH" >> "$GITHUB_ENV"

      - name: Resolve fastlane deploy target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy_target }}" = "production" ]; then
            echo "FASTLANE_DEPLOY_LANE=upload_production" >> "$GITHUB_ENV"
          else
            echo "FASTLANE_DEPLOY_LANE=upload_internal" >> "$GITHUB_ENV"
          fi

      - name: Upload to Google Play via fastlane
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ env.PLAY_SERVICE_ACCOUNT_JSON_PATH }}
          FASTLANE_DEPLOY_LANE: ${{ env.FASTLANE_DEPLOY_LANE }}
          AAB_PATH: app/build/outputs/bundle/release/app-release.aab
          MAPPING_PATH: app/build/outputs/mapping/release/mapping.txt
        run: |
          bundle exec fastlane android "$FASTLANE_DEPLOY_LANE"

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
