name: Android CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Created app/google-services.json from secret"
          else
            echo "Missing app/google-services.json."
            echo "Add the file in repository or configure GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi

      - name: Run static analysis, tests, and coverage gate
        shell: bash
        env:
          NAVERMAP_API_KEY: ${{ secrets.NAVERMAP_API_KEY || 'dummy' }}
          KAKAOLOGIN_API_KEY: ${{ secrets.KAKAOLOGIN_API_KEY || 'dummy' }}
          KAKAOLOGIN_REDIRECT_URI: ${{ secrets.KAKAOLOGIN_REDIRECT_URI || 'dummy://redirect' }}
          NAVERLOGIN_CLIENTID: ${{ secrets.NAVERLOGIN_CLIENTID || 'dummy' }}
          NAVERLOGIN_CLIENTSECRET: ${{ secrets.NAVERLOGIN_CLIENTSECRET || 'dummy' }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || 'dummy' }}
        run: |
          bash ./gradlew --no-daemon \
            :app:detekt \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:koverVerifyDebug \
            :app:koverXmlReportDebug

      - name: Generate quality summary
        if: always()
        shell: bash
        run: |
          bash ./scripts/generate_quality_summary.sh
          cat app/build/reports/quality/quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          if-no-files-found: warn
          path: |
            app/build/reports/quality/quality-summary.md
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/detekt/detekt.xml
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.sarif
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/kover/reportDebug.xml
            app/build/reports/kover/htmlDebug
