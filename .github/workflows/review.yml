name: PR Quality Review

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using repository google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Created app/google-services.json from secret"
          else
            echo "Missing app/google-services.json."
            echo "Add the file in repository or configure GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi

      - name: Run quality checks for review
        shell: bash
        env:
          NAVERMAP_API_KEY: ${{ secrets.NAVERMAP_API_KEY || 'dummy' }}
          KAKAOLOGIN_API_KEY: ${{ secrets.KAKAOLOGIN_API_KEY || 'dummy' }}
          KAKAOLOGIN_REDIRECT_URI: ${{ secrets.KAKAOLOGIN_REDIRECT_URI || 'dummy://redirect' }}
          NAVERLOGIN_CLIENTID: ${{ secrets.NAVERLOGIN_CLIENTID || 'dummy' }}
          NAVERLOGIN_CLIENTSECRET: ${{ secrets.NAVERLOGIN_CLIENTSECRET || 'dummy' }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY || 'dummy' }}
        run: |
          bash ./gradlew --no-daemon \
            :app:detekt \
            :app:lintDebug

      - name: Generate quality summary
        shell: bash
        run: |
          bash ./scripts/generate_quality_summary.sh
          cat app/build/reports/quality/quality-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert PR quality comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- quality-review-bot -->';
            const summaryPath = 'app/build/reports/quality/quality-summary.md';
            const summary = fs.readFileSync(summaryPath, 'utf8');
            const body = [
              marker,
              '## PR Quality Review',
              '',
              summary.trim(),
              '',
              '_Automated by review workflow._'
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
